<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>结构计算模块板V1 · 结构计算工具箱</title><link rel="stylesheet" href="style.css?report-red=1"><link rel="stylesheet" href="beam-taste.css?v=9"><link rel="stylesheet" href="fem-editor.css?v=7"><link rel="stylesheet" href="workbench-design.css?v=5"></head>
<body>
  <a class="skip-link" href="#main">跳到计算内容</a>
  <header class="topbar"><a class="brand" href="../" title="返回结构计算工具箱">SC<span>STONECALC<small>结构计算模块板V1</small></span></a><div class="top-actions"><span id="save-state" role="status">本地自动保存</span><button data-action="import">导入项目</button><button data-action="export">导出项目</button><button class="primary" data-action="report">生成计算书</button></div></header>
  <div class="workspace">
    <aside class="sidebar"><div class="eyebrow">PROJECT / 计算项目</div><div class="project-switch"><select id="projects" aria-label="选择项目"></select><button data-action="new" title="新建项目" aria-label="新建项目">＋</button></div><details class="project-settings"><summary>项目设置</summary><label class="field"><span>项目名称</span><input id="project-name" aria-label="项目名称" placeholder="项目名称"></label></details><button class="template-entry" data-action="templates">计算示例</button><div class="section-heading"><span>项目模块</span><span id="module-count">0</span></div><nav id="module-list" aria-label="项目模块"></nav><button class="add-module" data-action="catalog">＋ 添加计算模块</button><div class="sidebar-bottom"><p>按需添加模块，再建立参数引用。<br>排列顺序用于计算书章节。</p><span id="service-status">浏览器计算就绪…</span></div></aside>
    <main id="main" tabindex="-1"></main>
  </div>
  <dialog id="catalog"><div class="dialog-head"><div><div class="eyebrow">MODULE LIBRARY</div><h2>这次需要计算什么？</h2></div><button data-action="close-catalog" aria-label="关闭">×</button></div><p class="muted">按需添加；同一种模块可以添加多次，每个实例独立保存。</p><div id="catalog-items"></div></dialog>
  <dialog id="templates"><div class="dialog-head"><h2>计算示例</h2><button data-action="close-templates" aria-label="关闭模板">×</button></div><p class="muted">选择后新建独立项目，保留当前项目及输入。</p><div class="template-list"><div><h3>截面与连续梁联动</h3><p>100×60×4 矩形钢管、两跨连续梁与构件验算。参数仅作操作演示，可按实际情况修改。</p><button data-action="public-demo">载入联动示例</button></div></div></dialog>
  <dialog id="report"><div class="dialog-head"><h2>计算书预览</h2><div><button data-action="export-docx">导出 Word</button><button data-action="export-pdf">导出 PDF</button><button data-action="download-report">下载 HTML</button><button data-action="close-report" aria-label="关闭">×</button></div></div><div id="report-body"></div></dialog>
  <input id="import-file" type="file" accept=".json,application/json" hidden>
  <input id="cad-file" type="file" accept=".json,.dxf,.dwg" hidden>
  <dialog id="cad-import"><div class="dialog-head"><h2>导入 CAD 截面</h2><button id="cad-close" aria-label="关闭CAD导入">×</button></div><p id="cad-status" role="status"></p><div id="cad-review" hidden><div class="cad-review-grid"><div id="cad-preview"></div><div><label class="field"><span>CAD图形实际单位</span><select id="cad-units"><option value="">请选择实际单位</option><option value="1">毫米 mm</option><option value="10">厘米 cm</option><option value="1000">米 m</option><option value="25.4">英寸 in</option><option value="304.8">英尺 ft</option><option value="0.001">微米 μm</option></select></label><div id="cad-components"></div></div></div><div id="cad-excluded"></div><p id="cad-check" role="status"></p></div><div class="cad-footer"><button id="cad-apply" class="primary" disabled>应用选定轮廓</button></div></dialog>
  <dialog id="section-save"><div class="dialog-head"><h2>保存为常用截面</h2><button id="section-save-close" aria-label="关闭保存截面">×</button></div><form><label class="field"><span>常用截面名称</span><input id="section-save-name" maxlength="80" required placeholder="例如：主龙骨矩形钢管"></label><p id="section-save-status" class="hint" role="status"></p><button class="primary" type="submit">保存截面</button></form></dialog>
  <dialog id="section-library"><div class="dialog-head"><h2>常用截面库</h2><button id="section-library-close" aria-label="关闭常用截面库">×</button></div><div class="section-library-toolbar"><input id="section-library-search" aria-label="搜索常用截面" placeholder="按自定义名称搜索"><button data-lib-action="import">导入截面库</button><button data-lib-action="export">导出截面库</button></div><p id="section-library-status" class="hint" role="status"></p><div id="section-library-list"></div><div id="section-library-archive"></div><input type="file" id="section-library-file" accept=".json" hidden></dialog>
  <div id="toast" role="status"></div><button id="undo-empty" data-action="undo" hidden>撤销移除</button>
  <script src="engines/beam-source.js"></script><script type="module" src="app.mjs?report-red=20261026-v1"></script>
</body></html>
